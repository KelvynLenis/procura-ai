version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: procuraai-web:latest
    container_name: procuraai-web
    restart: always
    network_mode: host
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_TLS_REJECT_UNAUTHORIZED=0