version: '3'
services:
  app:
    build: .
    ports:
      - "3000:3000"  # Web
      - "19000:19000"  # Expo
      - "19001:19001"  # Expo
      - "19002:19002"  # Expo
      - "8081:8081"  # Metro bundler
      - "8082:8082"  # Metro bundler alternativo
    volumes:
      - ./mobile:/home/node/app
      - /home/node/app/node_modules
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.0.4
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    command: npx expo start --host 0.0.0.0