default:
  image: node:20-alpine
  tags:
    - homolog
    - docker
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci

stages:
  - validate
  - sync
  - deploy

variables:
  GIT_DEPTH: "0"
  HOMOLOG_BRANCH: "homolog.secties"
  NEXT_TELEMETRY_DISABLED: "1"

build:
  stage: validate
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == $HOMOLOG_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"

sync_to_homolog:
  stage: sync
  image: alpine:3.20
  needs:
    - job: build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache git
    - git config user.email "gitlab-ci@procuraai.local"
    - git config user.name "GitLab CI"
  script:
    - |
      set -euo pipefail
      if [ -z "${SYNC_TOKEN:-}" ] || [ -z "${SYNC_TOKEN_USER:-}" ]; then
        echo "Defina SYNC_TOKEN e SYNC_TOKEN_USER (glpat + oauth2)"
        exit 1
      fi
      REPO="${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      remote() { printf 'https://%s:%s@%s' "$1" "$2" "$REPO"; }

      git remote set-url origin "$(remote gitlab-ci-token "$CI_JOB_TOKEN")"
      git fetch origin develop "$HOMOLOG_BRANCH"
      git checkout -B "$HOMOLOG_BRANCH" "origin/$HOMOLOG_BRANCH"
      git merge origin/develop -X theirs --no-edit -m "chore(ci) sync develop into $HOMOLOG_BRANCH"
      git remote set-url origin "$(remote "$SYNC_TOKEN_USER" "$SYNC_TOKEN")"
      git push origin "$HOMOLOG_BRANCH"

deploy_homolog_ssh:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $HOMOLOG_BRANCH && $CI_PIPELINE_SOURCE == "push"
  before_script:
    - apk add --no-cache openssh-client git
    - |
      set -euo pipefail
      KEY="${CI_PROJECT_DIR}/.ssh_deploy_key"

      prep_key() {
        sed -i 's/\r$//' "$KEY"
        [ "$(tail -c1 "$KEY" | wc -l)" -eq 0 ] && echo >> "$KEY"
        chmod 600 "$KEY"
        ssh-keygen -y -f "$KEY" >/dev/null
      }
      try_file() {
        [ -n "${SSH_PRIVATE_KEY:-}" ] && [ -f "$SSH_PRIVATE_KEY" ] || return 1
        cp "$SSH_PRIVATE_KEY" "$KEY" && prep_key
      }
      try_b64() {
        [ -n "${SSH_PRIVATE_KEY_B64:-}" ] || return 1
        B64="$(printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '[:space:]')"
        printf '%s' "$B64" | base64 -d > "$KEY" && prep_key
      }
      try_file || try_b64 || { echo "Chave SSH invalida ou ausente"; exit 1; }
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${DEPLOY_SSH_PORT:-22024}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -euo pipefail
      DIR="${DEPLOY_PATH:-/home/procuraai/procuraai-web}"
      KEY="${CI_PROJECT_DIR}/.ssh_deploy_key"
      URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      ssh -i "$KEY" -o IdentitiesOnly=yes -p "${DEPLOY_SSH_PORT:-22024}" "${DEPLOY_USER}@${DEPLOY_HOST}" "
        set -euo pipefail
        cd '$DIR'
        git fetch '$URL' '$HOMOLOG_BRANCH'
        git checkout '$HOMOLOG_BRANCH'
        git reset --hard FETCH_HEAD
        chmod +x deploy.sh
        ./deploy.sh
      "
  environment:
    name: homolog
    url: https://procuraai-homolog.secties.pb.gov.br/
